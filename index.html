<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#101827">
  <title>TRANSHUB — Controlled by AI Agents</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- LOGIN / REGISTER SCREEN -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="brand" style="color:#101827;text-align:center;margin-bottom:8px">TRANSHUB <span>AI</span></div>
      <p class="muted" style="text-align:center;margin-bottom:20px">Controlled by AI Agents</p>

      <div id="authTabs" style="display:flex;gap:8px;margin-bottom:18px">
        <button class="btn" id="tabLogin" onclick="showLogin()" style="flex:1">Login</button>
        <button class="btn secondary" id="tabRegister" onclick="showRegister()" style="flex:1">Register</button>
      </div>

      <div id="loginForm">
        <label>Email</label>
        <input class="input" id="loginEmail" type="email" placeholder="you@email.com">
        <label>Password</label>
        <input class="input" id="loginPassword" type="password" placeholder="Password">
        <button class="btn" style="width:100%;margin-top:10px" onclick="doLogin()">Login</button>
      </div>

      <div id="registerForm" style="display:none">
        <label>Full Name</label>
        <input class="input" id="regName" placeholder="Your full name">
        <label>Email</label>
        <input class="input" id="regEmail" type="email" placeholder="you@email.com">
        <label>Password</label>
        <input class="input" id="regPassword" type="password" placeholder="Minimum 6 characters">
        <button class="btn" style="width:100%;margin-top:10px" onclick="doRegister()">Create Account</button>
      </div>

      <p id="authMessage" class="muted" style="text-align:center;margin-top:15px;min-height:20px"></p>
    </div>
  </div>

  <!-- KYC SCREEN -->
  <div id="kycScreen" class="auth-screen" style="display:none">
    <div class="auth-card" style="max-height:90vh;overflow-y:auto">
      <div class="brand" style="color:#101827;text-align:center;margin-bottom:8px">Complete KYC</div>
      <p class="muted" style="text-align:center;margin-bottom:18px">Verify your identity to use TRANSHUB</p>

      <label>Full Name</label>
      <input class="input" id="kycName" placeholder="Your full name">

      <label>Phone Number</label>
      <input class="input" id="kycPhone" placeholder="e.g. 08012345678">

      <label>Select your Role</label>
      <select class="input" id="kycRole" onchange="updateKycFields()">
        <option value="">-- Choose Role --</option>
        <option value="passenger">Passenger</option>
        <option value="driver">Driver</option>
        <option value="mechanic">Mechanic</option>
        <option value="seller">Seller / Facilitator</option>
        <option value="agent">Agent</option>
        <option value="transport_company">Transport Company</option>
      </select>

      <div id="kycExtraFields"></div>

      <button class="btn" style="width:100%;margin-top:12px" onclick="submitKyc()">Submit KYC</button>
      <p id="kycMessage" class="muted" style="text-align:center;margin-top:12px;min-height:20px"></p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app" style="display:none">
    <aside class="sidebar" id="sidebar">
      <div class="brand">TRANSHUB <span>AI</span></div>
      <p class="tagline">Controlled by AI Agents</p>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <button class="btn secondary" style="width:100%;margin-bottom:10px" onclick="doLogout()">Logout</button>
        Prototype v0.3 • KYC Enabled
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSub">Mobility, logistics, automotive and garage services in one ecosystem.</p>
        </div>
        <button class="ai-btn" onclick="openAI()">✦ Ask AI</button>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="close" onclick="closeModal()">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
