<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#101827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TRANSHUB — Controlled by AI Agents</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Desktop Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">TRANSHUB <span>AI</span></div>
      <p class="tagline">Controlled by AI Agents</p>
      <nav id="nav"></nav>
      <div class="sidebar-footer">Prototype v0.2<br>Payments & GPS are demo-only.</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSub">Mobility, logistics, automotive and garage services in one ecosystem.</p>
        </div>
        <button class="ai-btn" onclick="openAI()">✦ Ask AI</button>
      </header>

      <section id="content"></section>
    </main>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="bottom-nav" id="bottomNav"></nav>

  <!-- Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="close" onclick="closeModal()">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
